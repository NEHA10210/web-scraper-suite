<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | Smart Web Scraper Suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0F1117;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background elements */
        .bg-animation {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            opacity: 0.3;
        }

        .floating-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: linear-gradient(135deg, #F43F5E, #EF4444);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .floating-dot:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
        .floating-dot:nth-child(2) { top: 60%; left: 20%; animation-delay: 1s; }
        .floating-dot:nth-child(3) { top: 30%; left: 70%; animation-delay: 2s; }
        .floating-dot:nth-child(4) { top: 80%; left: 80%; animation-delay: 3s; }
        .floating-dot:nth-child(5) { top: 10%; left: 50%; animation-delay: 4s; }
        .floating-dot:nth-child(6) { top: 70%; left: 40%; animation-delay: 5s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.8; }
        }

        /* Broken robot illustration */
        .broken-robot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            z-index: 0;
            opacity: 0.1;
            animation: robotShake 4s ease-in-out infinite;
        }

        @keyframes robotShake {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg); opacity: 0.1; }
            25% { transform: translate(-48%, -50%) rotate(-2deg); opacity: 0.15; }
            75% { transform: translate(-52%, -50%) rotate(2deg); opacity: 0.15; }
        }

        /* Main content container */
        .container {
            text-align: center;
            z-index: 1;
            position: relative;
            max-width: 600px;
            padding: 20px;
        }

        /* 500 text with gradient */
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #F43F5E, #EF4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 16px;
            animation: glow 3s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        /* Title */
        .title {
            color: #FFFFFF;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        /* Subtitle */
        .subtitle {
            color: #94A3B8;
            font-size: 1rem;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* Button container */
        .button-container {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        /* Go Home button */
        .btn-home {
            background: linear-gradient(135deg, #F43F5E, #DC2626);
            color: #FFFFFF;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(244, 63, 94, 0.3);
            background: linear-gradient(135deg, #F87171, #EF4444);
        }

        /* Small text below */
        .help-text {
            color: #64748B;
            font-size: 0.875rem;
            opacity: 0.8;
        }

        /* Responsive design */
        @media (max-width: 640px) {
            .error-code {
                font-size: 6rem;
            }
            
            .title {
                font-size: 1.5rem;
            }
            
            .subtitle {
                font-size: 0.9rem;
            }
            
            .button-container {
                flex-direction: column;
                align-items: center;
            }
            
            .btn-home {
                width: 200px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Animated background -->
    <div class="bg-animation">
        <div class="floating-dot"></div>
        <div class="floating-dot"></div>
        <div class="floating-dot"></div>
        <div class="floating-dot"></div>
        <div class="floating-dot"></div>
        <div class="floating-dot"></div>
    </div>

    <!-- Broken robot illustration -->
    <svg class="broken-robot" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="robotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#F43F5E;stop-opacity:0.3" />
                <stop offset="100%" style="stop-color:#EF4444;stop-opacity:0.3" />
            </linearGradient>
        </defs>
        
        <!-- Robot head -->
        <rect x="70" y="40" width="60" height="50" rx="8" fill="none" stroke="url(#robotGradient)" stroke-width="2"/>
        
        <!-- Broken eyes (X marks) -->
        <line x1="80" y1="55" x2="90" y2="65" stroke="url(#robotGradient)" stroke-width="2"/>
        <line x1="90" y1="55" x2="80" y2="65" stroke="url(#robotGradient)" stroke-width="2"/>
        <line x1="110" y1="55" x2="120" y2="65" stroke="url(#robotGradient)" stroke-width="2"/>
        <line x1="120" y1="55" x2="110" y2="65" stroke="url(#robotGradient)" stroke-width="2"/>
        
        <!-- Robot body -->
        <rect x="65" y="90" width="70" height="60" rx="8" fill="none" stroke="url(#robotGradient)" stroke-width="2"/>
        
        <!-- Broken circuits inside body -->
        <circle cx="85" cy="110" r="3" fill="url(#robotGradient)"/>
        <circle cx="100" cy="110" r="3" fill="url(#robotGradient)"/>
        <circle cx="115" cy="110" r="3" fill="url(#robotGradient)"/>
        <line x1="85" y1="110" x2="100" y2="110" stroke="url(#robotGradient)" stroke-width="1"/>
        <line x1="100" y1="110" x2="115" y2="110" stroke="url(#robotGradient)" stroke-width="1"/>
        
        <!-- Arms -->
        <rect x="45" y="100" width="20" height="8" rx="4" fill="none" stroke="url(#robotGradient)" stroke-width="2"/>
        <rect x="135" y="100" width="20" height="8" rx="4" fill="none" stroke="url(#robotGradient)" stroke-width="2"/>
        
        <!-- Legs -->
        <rect x="80" y="150" width="12" height="30" rx="6" fill="none" stroke="url(#robotGradient)" stroke-width="2"/>
        <rect x="108" y="150" width="12" height="30" rx="6" fill="none" stroke="url(#robotGradient)" stroke-width="2"/>
        
        <!-- Error sparks -->
        <circle cx="130" cy="50" r="2" fill="url(#robotGradient)"/>
        <circle cx="140" cy="60" r="1.5" fill="url(#robotGradient)"/>
        <circle cx="125" cy="65" r="1" fill="url(#robotGradient)"/>
        <circle cx="60" cy="120" r="1.5" fill="url(#robotGradient)"/>
        <circle cx="55" cy="130" r="1" fill="url(#robotGradient)"/>
    </svg>

    <!-- Main content -->
    <div class="container">
        <div class="error-code">500</div>
        <h1 class="title">Server Error</h1>
        <p class="subtitle">Something went wrong on our end. We're fixing it!</p>
        
        <div class="button-container">
            <a href="/dashboard" class="btn-home">
                🏠 Go Home
            </a>
        </div>
        
        <p class="help-text">Please try again in a few moments</p>
    </div>
</body>
</html>
