<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Smart Web Scraper Suite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0F1117;
            --bg-secondary: #0D1117;
            --bg-tertiary: #161B22;
            --bg-glass: rgba(22, 27, 34, 0.7);
            --bg-glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #F0F6FC;
            --text-secondary: #8B949E;
            --text-muted: #656D76;
            --accent-cyan: #00D4FF;
            --accent-purple: #7C3AED;
            --accent-emerald: #10B981;
            --accent-amber: #F59E0B;
            --accent-rose: #F43F5E;
            --accent-cyan-glow: rgba(0, 212, 255, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
        }

        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            border-radius: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
            margin-bottom: 1rem;
        }

        .brand-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--accent-cyan);
        }

        .card-soft {
            background: var(--bg-glass);
            border: 1px solid var(--bg-glass-border);
            border-radius: 1rem;
            backdrop-filter: blur(12px);
            padding: 2rem;
        }

        .form-label {
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-control {
            background: var(--bg-tertiary);
            border: 1px solid var(--bg-glass-border);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            background: var(--bg-tertiary);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px var(--accent-cyan-glow);
            color: var(--text-primary);
        }

        .form-control::placeholder {
            color: var(--text-muted);
        }

        .input-group-text {
            background: var(--bg-tertiary);
            border: 1px solid var(--bg-glass-border);
            color: var(--text-muted);
        }

        .btn-gradient-cyan {
            background: linear-gradient(135deg, var(--accent-cyan), #0099CC);
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-gradient-cyan:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--accent-cyan-glow);
        }

        .btn-outline-secondary {
            background: transparent;
            border: 1px solid var(--bg-glass-border);
            color: var(--text-secondary);
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-outline-secondary:hover {
            background: var(--bg-tertiary);
            border-color: var(--accent-cyan);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .divider {
            text-align: center;
            margin: 1.5rem 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--bg-glass-border);
        }

        .divider span {
            background: var(--bg-glass);
            padding: 0 1rem;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .alert {
            background: var(--bg-glass);
            border: 1px solid var(--bg-glass-border);
            border-radius: 0.5rem;
            backdrop-filter: blur(12px);
        }

        .alert-danger {
            border-left: 4px solid var(--accent-rose);
            color: var(--accent-rose);
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container {
            animation: fadeIn 0.5s ease;
        }

        @keyframes titleShift {
          0%, 100% { background-position: 0% 50%; }
          50% { background-position: 100% 50%; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brand">
            <div class="brand-icon">
                <i class="bi bi-globe2"></i>
            </div>
            <h1 style="
  background: linear-gradient(
    135deg,
    #06B6D4,
    #6366F1,
    #06B6D4,
    #8B5CF6
  );
  background-size: 300% 300%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: titleShift 4s ease infinite;
  font-size: 2rem;
  font-weight: 800;
  text-align: center;
  margin: 16px 0 8px;
">Scraper Suite</h1>
        </div>

        <div class="card-soft">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div style="background: rgba(6, 182, 212, 0.15); border: 1px solid #06B6D4; color: #06B6D4; border-radius: 8px; padding: 12px 16px; font-weight: 500; font-size: 0.9rem; margin-bottom: 1rem;">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <div style="
                      display: flex;
                      align-items: center;
                      background: #1E293B;
                      border: 1px solid rgba(255,255,255,0.1);
                      border-radius: 10px;
                      padding: 0 14px;
                      gap: 10px;
                    ">
                      <!-- Email icon -->
                      <span style="color:#64748B;font-size:16px">✉️</span>
                      
                      <input 
                        type="email" 
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                        style="
                          flex: 1;
                          background: transparent;
                          border: none;
                          outline: none;
                          color: #E2E8F0;
                          font-size: 0.95rem;
                          padding: 14px 0;
                        "
                      >
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div style="
                      display: flex;
                      align-items: center;
                      background: #1E293B;
                      border: 1px solid rgba(255,255,255,0.1);
                      border-radius: 10px;
                      padding: 0 14px;
                      gap: 10px;
                    ">
                      <!-- Lock icon -->
                      <span style="color:#64748B;font-size:16px">🔒</span>
                      
                      <!-- Password input -->
                      <input 
                        type="password" 
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        style="
                          flex: 1;
                          background: transparent;
                          border: none;
                          outline: none;
                          color: #E2E8F0;
                          font-size: 0.95rem;
                          padding: 14px 0;
                        "
                      >
                      
                      <!-- Eye OPEN - default (password hidden) -->
<svg id="eyeOpen" 
  onclick="togglePassword()"
  xmlns="http://www.w3.org/2000/svg" 
  width="20" height="20" viewBox="0 0 24 24" 
  fill="none" stroke="#64748B" 
  stroke-width="2" stroke-linecap="round" 
  stroke-linejoin="round"
  style="cursor:pointer;display:block">
  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
  <circle cx="12" cy="12" r="3"/>
</svg>

<!-- Eye OFF - after click (password visible) -->
<svg id="eyeClosed"
  onclick="togglePassword()"
  xmlns="http://www.w3.org/2000/svg"
  width="20" height="20" viewBox="0 0 24 24"
  fill="none" stroke="#64748B"
  stroke-width="2" stroke-linecap="round"
  stroke-linejoin="round"
  style="cursor:pointer;display:none">
  <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/>
  <path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/>
  <line x1="1" y1="1" x2="23" y2="23"/>
</svg>
                    </div>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember">
                    <label class="form-check-label" for="remember">
                        Remember me
                    </label>
                </div>

                <button type="submit" class="btn-gradient-cyan mb-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Log In
                </button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="text-center">
                <small style="color: var(--text-muted);">Don't have an account?</small><br>
                <a href="{{ url_for('auth.signup') }}" style="color: var(--accent-cyan); text-decoration: none; font-weight: 500;">
                    Sign up
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword() {
  const input = document.getElementById('password');
  const eyeOpen = document.getElementById('eyeOpen');
  const eyeClosed = document.getElementById('eyeClosed');
  if (input.type === 'password') {
    input.type = 'text';
    eyeOpen.style.display = 'none';
    eyeClosed.style.display = 'block';
  } else {
    input.type = 'password';
    eyeOpen.style.display = 'block';
    eyeClosed.style.display = 'none';
  }
}
    </script>
</body>
</html>
